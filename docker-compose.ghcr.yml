x-app: &app
  image: ghcr.io/arumes31/mail-delivery-tester:latest
  depends_on:
    db:
      condition: service_healthy
  env_file: .env
  environment: &app-environment
    ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    ADMIN_TOTP_SECRET_FILE: /run/secrets/admin_totp
    ADMIN_USER: ${ADMIN_USER:?set ADMIN_USER in .env}
    DB_PASS_FILE: /run/secrets/db_password
    IMAP_PASS_FILE: /run/secrets/imap_password
    SECRET_KEY_FILE: /run/secrets/session_key
    SMTP_PASS_FILE: /run/secrets/smtp_password
  secrets:
    - admin_password
    - admin_totp
    - db_password
    - imap_password
    - session_key
    - smtp_password
  volumes:
    - ./data-web:/app/data-web
  networks:
    - backend
    - egress
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=32m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

services:
  db:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    environment:
      POSTGRES_USER: ${DB_USER:-maildt}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${DB_NAME:-maildt}
    secrets:
      - db_password
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-maildt} -d ${DB_NAME:-maildt}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    <<: *app
    environment:
      <<: *app-environment
      SERVICE_NAME: web
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-5000}:5000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  scheduler:
    <<: *app
    command: ["gunicorn", "--workers", "1", "--threads", "2", "--bind", "0.0.0.0:5001", "--timeout", "30", "--graceful-timeout", "30", "--keep-alive", "5", "--limit-request-line", "4094", "--limit-request-fields", "100", "--limit-request-field_size", "8190", "--access-logfile", "-", "--error-logfile", "-", "--capture-output", "scheduler:app"]
    environment:
      <<: *app-environment
      SERVICE_NAME: scheduler
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  backend:
    internal: true
  egress: {}

secrets:
  admin_password:
    file: ${ADMIN_PASSWORD_FILE:-./secrets/admin_password}
  admin_totp:
    file: ${ADMIN_TOTP_FILE:-./secrets/admin_totp}
  db_password:
    file: ${DB_PASSWORD_FILE:-./secrets/db_password}
  imap_password:
    file: ${IMAP_PASSWORD_FILE:-./secrets/imap_password}
  session_key:
    file: ${SESSION_KEY_FILE:-./secrets/session_key}
  smtp_password:
    file: ${SMTP_PASSWORD_FILE:-./secrets/smtp_password}
