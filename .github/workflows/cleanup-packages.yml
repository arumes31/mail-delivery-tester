name: Cleanup Old Packages

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run (don''t actually delete)'
        default: true
        type: boolean
      min_versions_to_keep:
        description: 'Minimum versions to keep'
        default: '3'
        required: true

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    timeout-minutes: 10
    steps:
      - name: Dry-run summary
        if: ${{ inputs.dry_run }}
        run: echo "Dry run; no package versions will be deleted. Set dry_run=false to execute cleanup."

      - name: Delete old package versions
        if: ${{ !inputs.dry_run }}
        uses: actions/delete-package-versions@25ad4af5be03aef10e0b3376b248688b7a44c40b # v5.0.0
        with:
          package-name: 'mail-delivery-tester'
          package-type: 'container'
          min-versions-to-keep: ${{ inputs.min_versions_to_keep }}
          ignore-versions: '^(latest|main|bench)$'
