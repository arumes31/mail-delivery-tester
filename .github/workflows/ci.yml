name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test and security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
        env:
          POSTGRES_USER: maildt_ci
          POSTGRES_PASSWORD: ci-only-postgres-password
          POSTGRES_DB: maildt_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maildt_ci -d maildt_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Lint first-party code
        run: ruff check .

      - name: Run security regression tests
        run: >-
          pytest
          --cov=security
          --cov=http_utils
          --cov-report=term-missing
          --cov-fail-under=85

      - name: Test PostgreSQL startup and persistence
        env:
          DB_USER: maildt_ci
          DB_PASS: ci-only-postgres-password
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: maildt_ci
          SECRET_KEY: ci-only-session-secret-with-32-characters
          ADMIN_USER: ci-admin
          ADMIN_PASSWORD: ci-only-admin-password
        run: python -m scripts.test_postgresql

      - name: Run Bandit
        run: bandit -c pyproject.toml -r app.py scheduler.py spam_decoder.py decode_wrapper.py security.py http_utils.py -ll -ii

      - name: Audit locked dependencies
        run: pip-audit -r requirements.txt --progress-spinner off
