name: Python CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test and security
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.8'
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install hash-locked dependencies
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Lint first-party code
        run: ruff check .

      - name: Run security regression tests
        run: >-
          pytest
          --cov=security
          --cov=http_utils
          --cov-report=term-missing
          --cov-fail-under=85

      - name: Run Bandit
        run: bandit -c pyproject.toml -r app.py scheduler.py spam_decoder.py decode_wrapper.py security.py http_utils.py -ll -ii

      - name: Audit locked dependencies
        run: pip-audit -r requirements.txt --progress-spinner off
