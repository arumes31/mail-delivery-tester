{% extends "base.html" %}

{% block content %}
<div class="row" id="whoisHeader">
    <div class="col-md-12 mb-4 d-flex justify-content-between align-items-center">
        <div>
            <h2><i class="fa-solid fa-search me-2"></i>WHOIS Lookup</h2>
            <p class="text-muted mb-0">External domain and IP information service.</p>
        </div>
        <a href="/" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
        </a>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <!-- External Service Launcher -->
        <div id="launcherPrompt" class="card shadow-lg border-primary mx-auto" style="max-width: 600px;">
            <div class="card-body p-5 text-center">
                <i class="fa-solid fa-arrow-up-right-from-square fa-4x text-primary mb-4 opacity-75"></i>
                <h4 class="text-white fw-bold mb-3">External Service Hub</h4>
                <p class="text-muted mb-4">
                    The WHOIS lookup tool runs on an external website: <br>
                    <code class="text-primary fw-bold">{{ whois_url }}</code>
                </p>
                <div class="d-grid gap-2">
                    <a href="{{ whois_url }}" target="_blank" class="btn btn-primary btn-lg">
                        <i class="fa-solid fa-external-link-alt me-2"></i> Open WHOIS Lookup
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
